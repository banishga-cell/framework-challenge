<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinosaur Zoo Warning Modal</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="overlay">
    <h1 class="display-4 fw-bold mb-3">
        <img src="dino.png" alt="Dino Icon" class="dino-icon me-2">
        DinoWatch System
    </h1>
    <p class="lead mb-4">Click below to check for containment alerts.</p>
    <button type="button" class="btn btn-danger btn-lg" data-bs-toggle="modal" data-bs-target="#warningModal">
      Show Warning
    </button>
  </div>
  <div class="modal fade" id="warningModal" tabindex="-1" aria-labelledby="warningModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-danger">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="warningModalLabel">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            WARNING: Containment Breach!
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-dark">
          <p><strong>Alert:</strong> Velociraptors have escaped the east paddock.</p>
          <p>All staff and visitors must evacuate immediately to the main visitor center.</p>
          <p class="fw-bold text-danger">Do not attempt to capture the dinosaurs.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Dismiss</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
